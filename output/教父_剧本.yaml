script:
  meta:
    title: 教父
    author: ''
    total_chapters: 5
    genre: ''
    converted_at: '2026-06-05 20:27:58'
  characters:
  - id: char_001
    name: 亚美利哥·邦纳塞拉
    role: 配角
    identity: 殡仪馆老板
    traits:
    - 隐忍
    - 偏执于美国法律秩序
    - 固执
    - 脆弱
    - 最终屈服
    description: 女儿遭暴徒殴打后寻求法律途径无果，迫于无奈向唐·柯里昂求助，代表了那些曾拒绝教父却最终不得不依靠他的人。
    relationships:
    - target: char_004
      relation: 请求帮助的求助者，唐的妻子是其女儿的教母
    - target: char_009
      relation: 法庭上对峙的对象，加害者的父母
  - id: char_002
    name: 约翰尼·方坦
    role: 配角
    identity: 著名歌手兼电影明星
    traits:
    - 魅力四射
    - 软弱
    - 感情用事
    - 念旧
    - 依赖教父
    description: 唐·柯里昂的教子，事业和婚姻双双陷入危机，回头求教父出手帮他争取一个关键角色，推动了黑根赴洛杉矶与沃尔茨交涉的情节。
    relationships:
    - target: char_004
      relation: 教子与教父
    - target: char_008
      relation: 汤姆代表他与沃尔茨谈判
    - target: char_014
      relation: 与沃尔茨有深仇，沃尔茨拒绝给他角色
    - target: char_015
      relation: 玛格特是他的现任妻子，两人关系破裂
    - target: char_016
      relation: 前妻金妮，已离婚但仍有子女联系
    - target: char_017
      relation: 童年挚友，婚礼上重逢的搭档
  - id: char_003
    name: 纳佐里尼
    role: 配角
    identity: 面包师
    traits:
    - 老实本分
    - 护家
    - 重情义
    - 传统
    - 务实
    description: 唐的儿时好友，为了让女儿的恋人恩佐留在美国入籍，向唐求助，是展现唐处理日常人情的典型案例之一。
    relationships:
    - target: char_004
      relation: 旧友，向唐求助
    - target: char_018
      relation: 父女关系
    - target: char_019
      relation: 女儿的意大利战俘恋人
  - id: char_004
    name: 唐·维托·柯里昂
    role: 主角
    identity: 黑手党教父，橄榄油进口商
    traits:
    - 沉稳睿智
    - 权威
    - 讲义气
    - 谦逊而不失威严
    - 洞察人心
    description: 故事核心人物，掌控着庞大的地下权力网络，以智慧和威望统御各方，拒绝毒品生意后遭到暗杀，成为后续一切冲突的导火索。
    relationships:
    - target: char_005
      relation: 父子，长子
    - target: char_006
      relation: 父子，次子
    - target: char_007
      relation: 父子，幼子
    - target: char_008
      relation: 养子般的顾问
    - target: char_002
      relation: 教父与教子
    - target: char_010
      relation: 女儿康妮
    - target: char_011
      relation: 垂死的老友，前任顾问
    - target: char_012
      relation: 最可信赖也最令人紧张的杀手
    - target: char_020
      relation: 拒绝其毒品合作提议的商业对手
    - target: char_021
      relation: 妻子
    - target: char_001
      relation: 妻子是其女儿教母，被求助的对象
  - id: char_005
    name: 桑尼·柯里昂
    role: 配角
    identity: 柯里昂家族长子，家族核心成员
    traits:
    - 冲动
    - 勇猛
    - 好色
    - 有领导力但缺乏克制
    - 忠于家族
    description: |-
      唐的长子，在唐遭到暗杀后暂时接掌家族事务，因脾气暴躁和判断失误而埋下隐患，同时对毒品生意表现出过于明显的兴趣，被索洛佐所利用。
    relationships:
    - target: char_004
      relation: 父子
    - target: char_006
      relation: 兄弟
    - target: char_007
      relation: 兄弟
    - target: char_008
      relation: 兄弟般的关系，共同参与家族事务
    - target: char_022
      relation: 妻子珊德拉
    - target: char_023
      relation: 婚外情对象，妹妹的伴娘
  - id: char_006
    name: 弗雷迪·柯里昂
    role: 配角
    identity: 柯里昂家族次子
    traits:
    - 忠诚孝顺
    - 缺乏决断力
    - 情绪脆弱
    - 平庸
    - 善良
    description: 唐的次子，在父亲遭枪击时因惊吓过度而休克失能，没有展现出应有的保护能力，被认为缺乏接班的魄力。
    relationships:
    - target: char_004
      relation: 父子
    - target: char_005
      relation: 兄弟
    - target: char_007
      relation: 兄弟
  - id: char_007
    name: 迈克尔·柯里昂
    role: 主角
    identity: 柯里昂家族幼子，大学生，退伍军官
    traits:
    - 冷静理智
    - 独立自主
    - 内敛深沉
    - 观察敏锐
    - 逐渐卷入家族事务
    description: 唐最小的儿子，原本刻意与家族黑暗面保持距离，父亲遭暗杀后被迫卷入，冷静的判断力和军事经历使他逐渐展现出接班的潜质。
    relationships:
    - target: char_004
      relation: 父子，被唐视为最有潜力的接班人
    - target: char_005
      relation: 兄弟
    - target: char_006
      relation: 兄弟
    - target: char_008
      relation: 兄弟般的养兄关系
    - target: char_024
      relation: 女友，新英格兰出身的美国姑娘，计划秘密结婚
  - id: char_008
    name: 汤姆·黑根
    role: 配角
    identity: 家族律师兼顾问（军师）
    traits:
    - 精明冷静
    - 忠诚
    - 务实
    - 善于谈判
    - 情感克制
    description: 唐从街头收留、一手培养的德裔爱尔兰孤儿，成为家族最重要的顾问，负责对外谈判和处理棘手事务，被索洛佐劫持后凭口才脱险。
    relationships:
    - target: char_004
      relation: 养子般的顾问与养父般的老板
    - target: char_005
      relation: 兄弟般的家族成员
    - target: char_007
      relation: 养兄弟
    - target: char_014
      relation: 奉命赴洛杉矶与其谈判
    - target: char_020
      relation: 代表唐与其首次会面
    - target: char_025
      relation: 妻子特蕾莎
    - target: char_011
      relation: 代理其顾问职位长达一年
  - id: char_009
    name: 杰瑞·瓦格纳 / 凯文·穆南
    role: 路人
    identity: 大学生，邦纳塞拉女儿的侵犯者
    traits:
    - 嚣张跋扈
    - 仗势横行
    - 轻浮
    - 后来遭到报应
    description: 因强力家庭背景而逃脱法律制裁的两个年轻人，最终被保利·加图等人奉命痛打，成为唐为求助者伸张正义的具体体现。
    relationships:
    - target: char_001
      relation: 侵犯其女儿的加害者
    - target: char_026
      relation: 被保利·加图奉命惩罚
  - id: char_010
    name: 康妮·柯里昂
    role: 配角
    identity: 唐的女儿，新娘
    traits:
    - 活泼热情
    - 略显任性
    - 对丈夫怀有幻想
    - 神经质
    description: 故事开篇的婚礼主角，她的婚礼是第一章所有情节的舞台背景，她对丈夫卡洛的选择让唐失望，婚后生活也并不幸福。
    relationships:
    - target: char_004
      relation: 父女
    - target: char_013
      relation: 丈夫卡洛·里齐
    - target: char_023
      relation: 最好的朋友，她的伴娘
  - id: char_011
    name: 占科·阿班丹多
    role: 配角
    identity: 唐的前任顾问，身患癌症
    traits:
    - 忠诚
    - 历经沧桑
    - 临终时恐惧
    - 狡猾
    - 对唐依赖至深
    description: 唐多年的老友和顾问，在医院弥留之际仍求唐陪伴左右，他的去世使黑根正式获得顾问头衔，是家族权力传承的关键节点。
    relationships:
    - target: char_004
      relation: 旧友与前任顾问，唐亲自陪他走完最后时光
    - target: char_008
      relation: 黑根代理其顾问职位，后继承该职位
  - id: char_012
    name: 卢卡·布拉齐
    role: 配角
    identity: 唐最凶悍的杀手，家族核心武力
    traits:
    - 暴戾
    - 对唐绝对忠诚
    - 令人恐惧
    - 孤独
    - 像自然界的力量
    description: 外表凶残、令所有人胆寒的杀手，对唐抱有近乎崇拜的忠诚，在唐遭到暗杀前夕下落不明，成为全书最大的悬念之一。
    relationships:
    - target: char_004
      relation: 心甘情愿效忠的主人，对唐有罕见的敬爱之情
    - target: char_008
      relation: 黑根清楚他的秘密但不愿透露
  - id: char_013
    name: 卡洛·里齐
    role: 配角
    identity: 康妮的新郎，家族的附属成员
    traits:
    - 贪财
    - 投机
    - 表面殷勤
    - 本质上是窝囊废
    - 好赌酗酒
    description: 混血新郎，眼睛盯着婚礼收到的礼金，唐明确拒绝让他了解家族生意，婚后品行败坏，打骂康妮，是家族的一个负担。
    relationships:
    - target: char_010
      relation: 丈夫与妻子
    - target: char_005
      relation: 通过桑尼认识康妮
  - id: char_014
    name: 杰克·沃尔茨
    role: 配角
    identity: 好莱坞顶级电影制片人
    traits:
    - 傲慢
    - 色欲旺盛
    - 刚愎自用
    - 最终被吓服
    - 误判了唐的实力
    description: |-
      因私人恩怨拒绝给约翰尼安排角色，对黑根的游说不为所动，直到早晨发现爱马喀土穆的头颅出现在床上，才彻底屈服，成为唐手段的最有力注脚。
    relationships:
    - target: char_002
      relation: 宿敌，拒绝给约翰尼角色
    - target: char_008
      relation: 被黑根登门游说，最终被迫妥协
  - id: char_015
    name: 玛格特·艾什顿
    role: 路人
    identity: 好莱坞顶级女明星，约翰尼的现任妻子
    traits:
    - 美艳
    - 放荡
    - 冷酷嘲讽
    - 以美貌为盾牌
    description: 约翰尼为之抛弃家庭的女明星，对约翰尼的感情和暴力行为毫不在意，用嘲讽将他彻底击垮，是约翰尼堕落的根源之一。
    relationships:
    - target: char_002
      relation: 现任妻子，两人关系极度恶劣
  - id: char_016
    name: 金妮
    role: 路人
    identity: 约翰尼的前妻
    traits:
    - 独立
    - 有原则
    - 对约翰尼不妥协
    description: 约翰尼抛弃的糟糠之妻，虽在故事中未直接出场，但唐以她和孩子为由敦促约翰尼反省，是约翰尼良知的象征。
    relationships:
    - target: char_002
      relation: 前妻，共同抚养孩子
  - id: char_017
    name: 尼诺·瓦伦蒂
    role: 配角
    identity: 歌手，约翰尼的童年挚友
    traits:
    - 豪放不羁
    - 爱喝酒
    - 才华有限但真诚
    - 不抱怨
    description: 婚礼上操起曼陀林为宾客献唱的老友，被唐当作约翰尼忽视友谊的反面教材，也是唐教导约翰尼"友谊比天赋更重要"时的核心例子。
    relationships:
    - target: char_002
      relation: 童年挚友，后被约翰尼疏远
  - id: char_018
    name: 凯瑟琳·纳佐里尼
    role: 路人
    identity: 面包师的女儿
    traits:
    - 痴情
    - 普通
    - 为爱勇敢
    description: 爱上战俘恩佐的面包师女儿，以威胁离家出走来逼父亲接受这段关系，是推动父亲向唐求助的直接动因。
    relationships:
    - target: char_003
      relation: 父女
    - target: char_019
      relation: 恋人关系
  - id: char_019
    name: 恩佐
    role: 路人
    identity: 意大利战俘，面包房帮工
    traits:
    - 诚恳
    - 敢于表达爱意
    - 懂得感恩
    description: 在战争期间假释来美的意大利战俘，真心求娶凯瑟琳，面临被遣返的困境，其处境为唐提供了一个展示影响力的机会。
    relationships:
    - target: char_018
      relation: 恋人，求婚对象
    - target: char_003
      relation: 主顾与帮工，寻求接纳
  - id: char_020
    name: 维吉尔·"土佬"·索洛佐
    role: 配角
    identity: 毒品贩子，黑帮人物
    traits:
    - 精明危险
    - 冷酷
    - 擅长谋划
    - 果断
    - 善于利用他人弱点
    description: |-
      寻求柯里昂家族资金和政治庇护来开展毒品生意的枭雄，遭唐拒绝后策划暗杀，同时绑架黑根作为谈判筹码，是第一、二、三章核心冲突的制造者。
    relationships:
    - target: char_004
      relation: 被唐拒绝合作后转为敌对，策划暗杀唐
    - target: char_027
      relation: 与塔塔利亚家族结盟
    - target: char_008
      relation: 绑架黑根以图谈判
  - id: char_021
    name: 唐·柯里昂的妻子（妈妈柯里昂）
    role: 路人
    identity: 唐的妻子，家族母亲
    traits:
    - 传统
    - 质朴
    - 坚强
    - 是邦纳塞拉女儿的教母
    description: 唐的妻子，在婚礼欢庆和后来唐遭枪击的危机中始终是家庭的情感支柱，丈夫受伤后守在医院病床前。
    relationships:
    - target: char_004
      relation: 夫妻
    - target: char_001
      relation: 是邦纳塞拉女儿的教母，两家因此有关联
  - id: char_022
    name: 珊德拉（桑尼的妻子）
    role: 路人
    identity: 桑尼的妻子
    traits:
    - 粗俗直爽
    - 泼辣
    - 善于接受现实
    description: 桑尼的妻子，生育了三个孩子，以调侃式的方式接受了桑尼不忠的现实，在唐遭到枪击后按照桑尼的吩咐守在家中。
    relationships:
    - target: char_005
      relation: 丈夫与妻子
  - id: char_023
    name: 露西·曼奇尼
    role: 配角
    identity: 康妮的伴娘，大学生
    traits:
    - 大胆
    - 渴望情欲
    - 主动
    - 心理有自卑情结
    description: 康妮的好友兼伴娘，在婚礼当天主动与桑尼发生性关系，此后满心期待桑尼的电话，是展现桑尼好色本性和意大利社区文化的重要配角。
    relationships:
    - target: char_005
      relation: 婚礼上的一夜情对象，之后仍怀有幻想
    - target: char_010
      relation: 最好的朋友
  - id: char_024
    name: 凯·亚当斯
    role: 配角
    identity: 迈克尔的女友，新英格兰名门之后
    traits:
    - 聪慧好奇
    - 坦率
    - 对柯里昂家族既着迷又警惕
    - 真诚
    description: 迈克尔带到婚礼上的未婚妻，新英格兰纯正的美国姑娘，是迈克尔与正常世界之间的纽带，两人计划在圣诞节期间秘密结婚。
    relationships:
    - target: char_007
      relation: 男友，计划结婚
  - id: char_025
    name: 特蕾莎·黑根
    role: 路人
    identity: 汤姆·黑根的妻子
    traits:
    - 优雅
    - 情感细腻
    - 为丈夫担忧
    description: 黑根的妻子，在黑根被索洛佐绑架期间独自在柯里昂家族中等待，丈夫回来时失控痛哭，是展现家族内部情感联结的次要人物。
    relationships:
    - target: char_008
      relation: 丈夫与妻子
  - id: char_026
    name: 保利·加图
    role: 配角
    identity: 家族小头目，唐的私人司机保镖
    traits:
    - 谨慎狡猾
    - 野心勃勃
    - 贪财
    - 出卖主人
    - 办事利落
    description: 唐的司机兼保镖，为钱出卖情报给索洛佐，在唐遭枪击当天以病假为由缺席，被桑尼识破，是第一个被列上暗杀名单的叛徒。
    relationships:
    - target: char_004
      relation: 下属兼保镖，实则叛徒
    - target: char_028
      relation: 上司克莱门扎
    - target: char_020
      relation: 出卖情报给索洛佐
  - id: char_027
    name: 塔塔利亚家族（菲利普·塔塔利亚 / 约翰·塔塔利亚）
    role: 配角
    identity: 纽约五大家族之一，索洛佐的后台
    traits:
    - 野心勃勃
    - 支持毒品生意
    - 与柯里昂家族为敌
    description: 为索洛佐的毒品计划提供担保和支持，在唐遭到暗杀后成为柯里昂家族的主要敌对势力，被桑尼列入暗杀名单。
    relationships:
    - target: char_020
      relation: 同盟，为其提供后台支持
    - target: char_004
      relation: 策划针对唐的暗杀行动的共谋
  - id: char_028
    name: 彼得·克莱门扎
    role: 配角
    identity: 家族首领之一
    traits:
    - 肥胖豪爽
    - 经验丰富
    - 忠于家族
    - 处事老到
    description: 唐麾下的重要首领，在婚礼上活跃欢快，保利·加图的直接上司，唐遭到暗杀后配合桑尼参与应对，奉命处置叛徒保利。
    relationships:
    - target: char_004
